name: open-evidence-fulltext-audit-3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-one:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        key:
          - frontiers-frobt-2021-652776
          - arxiv-2006-11194
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Download and audit lawful open fulltext
        run: |
          python open_evidence_runner/fulltext_single_audit.py \
            --config open_evidence_runner/fulltext_batch3_targets.json \
            --key "${{ matrix.key }}" \
            --output fulltext-audit-3
      - name: Upload per-paper audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-${{ matrix.key }}
          path: fulltext-audit-3/${{ matrix.key }}/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Enforce verified status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          key='${{ matrix.key }}'
          result=json.loads((Path('fulltext-audit-3')/key/'audit.json').read_text())
          assert result['validation_status']=='verified', result
          PY
