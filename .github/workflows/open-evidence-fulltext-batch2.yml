name: open-evidence-fulltext-batch2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Download and verify lawful open fulltexts
        run: python open_evidence_runner/fulltext_batch2_audit.py --output fulltext-batch2
      - name: Validate audit summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('fulltext-batch2/completion_summary.json').read_text())
          assert summary['targets'] == 14
          assert summary['verified'] >= 1
          PY
      - name: Upload audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-evidence-fulltext-batch2
          path: fulltext-batch2/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
