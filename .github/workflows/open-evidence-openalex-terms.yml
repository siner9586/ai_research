name: open-evidence-openalex-term-backfill

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: open-evidence-openalex-terms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  YEARS: '[2018,2019,2020,2021,2022,2023,2024,2025,2026]'

jobs:
  openalex-terms-a:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
        term_key:
          - Q01_XAI_FAITHFULNESS__01
          - Q01_XAI_FAITHFULNESS__02
          - Q01_XAI_FAITHFULNESS__03
          - Q01_XAI_FAITHFULNESS__04
          - Q02_XAI_STABILITY__01
          - Q02_XAI_STABILITY__02
          - Q02_XAI_STABILITY__03
          - Q02_XAI_STABILITY__04
          - Q03_XAI_COMPLETENESS__01
          - Q03_XAI_COMPLETENESS__02
          - Q03_XAI_COMPLETENESS__03
          - Q03_XAI_COMPLETENESS__04
          - Q04_XAI_MECHANISTIC_ALIGNMENT__01
          - Q04_XAI_MECHANISTIC_ALIGNMENT__02
          - Q04_XAI_MECHANISTIC_ALIGNMENT__03
          - Q04_XAI_MECHANISTIC_ALIGNMENT__04
          - Q05_HUMAN_AI_RELIANCE__01
          - Q05_HUMAN_AI_RELIANCE__02
          - Q05_HUMAN_AI_RELIANCE__03
          - Q05_HUMAN_AI_RELIANCE__04
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps: &term_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Restore latest checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: openalex-term-${{ matrix.year }}-${{ matrix.term_key }}
        run: |
          python - <<'PY'
          import io, json, os, pathlib, zipfile
          import requests

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          name = os.environ["ARTIFACT_NAME"]
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
          response = requests.get(url, headers=headers, params={"name": name, "per_page": 100}, timeout=60)
          response.raise_for_status()
          artifacts = [a for a in response.json().get("artifacts", []) if not a.get("expired")]
          if not artifacts:
              print(json.dumps({"artifact": name, "restored": False, "reason": "no_prior_artifact"}))
              raise SystemExit(0)
          artifact = max(artifacts, key=lambda a: (a.get("created_at") or "", int(a["id"])))
          archive = requests.get(artifact["archive_download_url"], headers=headers, timeout=300)
          archive.raise_for_status()
          root = pathlib.Path("output").resolve()
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive.content)) as zf:
              for member in zf.infolist():
                  target = (root / member.filename).resolve()
                  if root not in target.parents and target != root:
                      raise RuntimeError(f"unsafe_artifact_member:{member.filename}")
              zf.extractall(root)
          completion = list(root.glob("completion/openalex_*.json"))
          checkpoint = list(root.glob("checkpoints/**/*.json"))
          state = json.loads(completion[0].read_text()) if completion else {}
          print(json.dumps({
              "artifact": name,
              "restored": True,
              "artifact_id": artifact["id"],
              "prior_completed": bool(state.get("completed")),
              "prior_pages": state.get("pages_completed"),
              "prior_cursor": state.get("cursor_end"),
              "checkpoint_files": len(checkpoint),
          }, indent=2))
          PY
      - name: Exhaust one official OpenAlex cursor chain
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: >-
          python open_evidence_runner/openalex_term_backfill.py
          --year "${{ matrix.year }}"
          --term-key "${{ matrix.term_key }}"
          --terms open_evidence_runner/openalex_terms.json
          --output output
          --hours 4.5
      - name: Upload term audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-term-${{ matrix.year }}-${{ matrix.term_key }}
          path: output/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error

  openalex-terms-b:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
        term_key:
          - Q06_ALGORITHMIC_ADVICE__01
          - Q06_ALGORITHMIC_ADVICE__02
          - Q06_ALGORITHMIC_ADVICE__03
          - Q06_ALGORITHMIC_ADVICE__04
          - Q07_AUTOMATION_BIAS__01
          - Q07_AUTOMATION_BIAS__02
          - Q07_AUTOMATION_BIAS__03
          - Q08_TRUST_CALIBRATION__01
          - Q08_TRUST_CALIBRATION__02
          - Q08_TRUST_CALIBRATION__03
          - Q09_PROFESSIONAL_DECISION__01
          - Q09_PROFESSIONAL_DECISION__02
          - Q09_PROFESSIONAL_DECISION__03
          - Q09_PROFESSIONAL_DECISION__04
          - Q10_MANAGEMENT_ORGANIZATION__01
          - Q10_MANAGEMENT_ORGANIZATION__02
          - Q10_MANAGEMENT_ORGANIZATION__03
          - Q10_MANAGEMENT_ORGANIZATION__04
          - Q11_TRANSFORMER_EXPLANATION__01
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps: *term_steps

  openalex-terms-c:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
        term_key:
          - Q11_TRANSFORMER_EXPLANATION__02
          - Q11_TRANSFORMER_EXPLANATION__03
          - Q11_TRANSFORMER_EXPLANATION__04
          - Q12_LLM_EXPLANATION__01
          - Q12_LLM_EXPLANATION__02
          - Q12_LLM_EXPLANATION__03
          - Q13_OPEN_DATA_REPLICATION__01
          - Q13_OPEN_DATA_REPLICATION__02
          - Q13_OPEN_DATA_REPLICATION__03
          - Q13_OPEN_DATA_REPLICATION__04
          - Q14_CHINESE_XAI__01
          - Q14_CHINESE_XAI__02
          - Q14_CHINESE_XAI__03
          - Q14_CHINESE_XAI__04
          - Q15_CHINESE_HUMAN_AI__01
          - Q15_CHINESE_HUMAN_AI__02
          - Q15_CHINESE_HUMAN_AI__03
          - Q15_CHINESE_HUMAN_AI__04
          - Q15_CHINESE_HUMAN_AI__05
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps: *term_steps

  aggregate:
    if: always()
    needs: [openalex-terms-a, openalex-terms-b, openalex-terms-c]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all term artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openalex-term-*
          path: combined
          merge-multiple: true
      - name: Build annual masters and aggregate audit
        run: >-
          python open_evidence_runner/combine_openalex_terms.py
          --input combined
          --output aggregate
          --terms open_evidence_runner/openalex_terms.json
      - name: Upload aggregate audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-term-backfill-all
          path: aggregate/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
