name: open-evidence-pmc-oa-transport

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Retry exact PMC OA links
        run: python open_evidence_runner/pmc_oa_transport_retry.py --output pmc-oa-transport
      - name: Validate accounting
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('pmc-oa-transport/completion_summary.json')
          if not p.exists():
              raise SystemExit('completion summary missing')
          s=json.loads(p.read_text())
          assert s['targets']==2
          assert s['verified']+s['retryable']==2
          PY
      - name: Upload audit and exact OA API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-evidence-pmc-oa-transport
          path: pmc-oa-transport/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
      - name: Upload 2025 financial trust PDF
        if: ${{ hashFiles('pmc-oa-transport/doi_10.3390_bs15101370.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-pmc-transport-doi-10.3390-bs15101370
          path: pmc-oa-transport/doi_10.3390_bs15101370.pdf
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Upload 2024 financial trust PDF
        if: ${{ hashFiles('pmc-oa-transport/doi_10.3390_bs14100964.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-pmc-transport-doi-10.3390-bs14100964
          path: pmc-oa-transport/doi_10.3390_bs14100964.pdf
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
