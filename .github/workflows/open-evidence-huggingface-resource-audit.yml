name: open-evidence-huggingface-resource-audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hub metadata audit runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Retrieve official Hugging Face API metadata and file lists
        run: python open_evidence_runner/audit_huggingface_resources.py
      - name: Validate resource classifications and revision records
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('huggingface-resource-audit')
          summary=json.loads((root/'completion_summary.json').read_text())
          resources=json.loads((root/'resource_audit.json').read_text())
          files=list(csv.DictReader((root/'file_manifest.csv').open()))
          assert summary['targets']==4
          assert summary['completed']>=1
          assert summary['binary_files_downloaded'] is False
          assert len(resources)==4
          assert sum(r['relation']=='linked_research_dataset' for r in resources)==1
          assert sum(r['relation']=='third_party_model_dependency' for r in resources)==3
          assert len(files)==summary['file_manifest_rows']
          for row in resources:
              if row['completed']:
                  assert row['revision']
                  assert row['binary_files_downloaded'] is False
          PY
      - name: Upload metadata, licenses and file manifest only
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-resource-audit
          path: huggingface-resource-audit/
          retention-days: 30
          compression-level: 9
          if-no-files-found: error
