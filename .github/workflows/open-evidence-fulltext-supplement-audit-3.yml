name: open-evidence-fulltext-supplement-audit-3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lawful archive runtime
        run: python -m pip install --disable-pip-version-check requests pypdf beautifulsoup4
      - name: Audit author-hosted and institutional-repository manuscripts
        run: python open_evidence_runner/fulltext_and_supplement_batch_3.py
      - name: Validate two fulltexts and supplementary identity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('fulltext-supplement-audit-3')
          report=json.loads((root/'audit_report.json').read_text())
          assert report['targets']==2
          assert report['verified_pdfs']==2
          assert report['verified_supplements']==1
          assert not [e for e in report['errors'] if e['stage']=='pdf']
          for row in report['pdfs']:
              path=root/row['local_file']
              assert path.read_bytes()[:5]==b'%PDF-'
              assert hashlib.sha256(path.read_bytes()).hexdigest()==row['sha256']
              assert len(PdfReader(str(path)).pages)==row['page_count']
              assert row['title_match_ratio']>=0.75
          PY
      - name: Upload verified fulltexts, supplement and audit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-evidence-fulltext-supplement-audit-3
          path: fulltext-supplement-audit-3/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
