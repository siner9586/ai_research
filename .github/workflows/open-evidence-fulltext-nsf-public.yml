name: open-evidence-fulltext-nsf-public

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Download and validate NSF accepted manuscript
        run: python open_evidence_runner/fulltext_nsf_public.py --output fulltext-nsf-public
      - name: Upload verified artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-evidence-fulltext-nsf-public
          path: fulltext-nsf-public/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
