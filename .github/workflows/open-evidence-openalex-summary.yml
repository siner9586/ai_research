name: open-evidence-openalex-summary
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Extract compact OpenAlex audit summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python open_evidence_runner/extract_remote_openalex_summary.py
          --repository siner9586/ai_research
          --artifact-id 8618274345
          --output openalex-summary
      - uses: actions/upload-artifact@v4
        with:
          name: openalex-summary-only
          path: openalex-summary/
          retention-days: 30
          compression-level: 9
          if-no-files-found: error
