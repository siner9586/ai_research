name: open-evidence-alternate-oa-batch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Download from alternate lawful open sources
        run: python open_evidence_runner/alternate_oa_fulltext_audit.py --output alternate-oa-batch
      - name: Validate audit outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('alternate-oa-batch/completion_summary.json')
          s = json.loads(p.read_text())
          assert s['targets'] == 5
          assert s['verified'] >= 1
          assert s['verified'] + s['manual_review'] + s['retryable'] == 5
          PY
      - name: Upload lawful OA audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-evidence-alternate-oa-batch
          path: alternate-oa-batch/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
