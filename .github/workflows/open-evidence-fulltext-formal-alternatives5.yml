name: open-evidence-fulltext-formal-alternatives5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Audit lawful alternative versions
        run: python open_evidence_runner/fulltext_formal_alternatives5.py --output fulltext-formal-alternatives5
      - name: Validate accounting
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('fulltext-formal-alternatives5/completion_summary.json')
          if not p.exists(): raise SystemExit('completion summary missing')
          s=json.loads(p.read_text())
          assert s['targets']==6
          assert s['verified']+s['manual_review']+s['retryable']==6
          PY
      - name: Upload verified files and audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-evidence-fulltext-formal-alternatives5
          path: fulltext-formal-alternatives5/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
