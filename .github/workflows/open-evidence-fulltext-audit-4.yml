name: open-evidence-fulltext-audit-4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-evidence-fulltext-audit-4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Download and audit public-domain publisher fulltext
        run: |
          python open_evidence_runner/fulltext_single_audit.py \
            --config open_evidence_runner/fulltext_batch4_targets.json \
            --key sage-public-domain-1555343418799601 \
            --output fulltext-audit-4
      - name: Upload audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-sage-public-domain-1555343418799601
          path: fulltext-audit-4/sage-public-domain-1555343418799601/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Enforce verified status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('fulltext-audit-4/sage-public-domain-1555343418799601/audit.json').read_text())
          assert result['validation_status']=='verified', result
          assert result['doi_match'] is True, result
          PY
