name: open-evidence-fulltext-algorithm-appreciation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Download and verify the lawful UC eScholarship version
        run: python open_evidence_runner/fulltext_algorithm_appreciation.py
      - name: Validate audit package
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('algorithm-appreciation-fulltext')
          report=json.loads((root/'fulltext_audit.json').read_text())
          pdf=root/report['local_file']
          assert report['validation_status']=='verified'
          assert report['doi_match'] is True
          assert report['license_match'] is True
          assert report['page_count']==15
          assert report['sha256']==hashlib.sha256(pdf.read_bytes()).hexdigest()
          assert pdf.read_bytes()[:5]==b'%PDF-'
          PY
      - name: Upload verified manuscript and audit metadata
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-algorithm-appreciation-escholarship
          path: algorithm-appreciation-fulltext/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
