name: open-evidence-jemr-pmc-oa-audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMC package audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Retrieve and audit official PMC OA package
        id: retrieve
        shell: bash
        run: |
          set +e
          mkdir -p jemr-pmc-oa-audit
          python open_evidence_runner/audit_jemr_pmc_oa.py --output jemr-pmc-oa-audit 2>&1 | tee jemr-pmc-oa-audit/execution.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate hashes and result
        if: ${{ steps.retrieve.outputs.exit_code == '0' }}
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('jemr-pmc-oa-audit')
          s=json.loads((root/'completion_summary.json').read_text())
          assert s['pmc_id']=='PMC13214853'
          assert s['completed'] is True
          assert s['verified_article_pdf']['validation_status']=='oa_pdf_verified'
          assert s['code_executed'] is False
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              expected,rel=line.split('  ',1)
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==expected
          PY
      - name: Upload official PMC OA package audit and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jemr-pmc-oa-package-audit
          path: jemr-pmc-oa-audit/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
      - name: Fail after preserving diagnostics
        if: ${{ steps.retrieve.outputs.exit_code != '0' }}
        run: exit 1
