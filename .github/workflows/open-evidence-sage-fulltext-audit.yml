name: open-evidence-sage-fulltext-audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Audit unauthenticated publisher PDF endpoints
        run: python open_evidence_runner/audit_sage_core_fulltexts.py --output sage-fulltext-audit
      - name: Validate status accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('sage-fulltext-audit/completion_summary.json').read_text())
          assert s['targets']==2
          assert sum(s['status_counts'].values())==2
          PY
      - name: Upload audit package
        uses: actions/upload-artifact@v4
        with:
          name: sage-core-fulltext-access-audit
          path: sage-fulltext-audit/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
      - name: Upload public-domain candidate PDF if verified
        if: ${{ hashFiles('sage-fulltext-audit/doi_10.1177_1555343418799601.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pdf-doi-10.1177-1555343418799601
          path: sage-fulltext-audit/doi_10.1177_1555343418799601.pdf
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Upload cognitive-load PDF if lawfully served and verified
        if: ${{ hashFiles('sage-fulltext-audit/doi_10.1177_0018720818781224.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pdf-doi-10.1177-0018720818781224
          path: sage-fulltext-audit/doi_10.1177_0018720818781224.pdf
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
