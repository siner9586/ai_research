name: open-evidence-crossref-targeted-summary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: open-evidence-crossref-targeted-summary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Extract Crossref 2025 targeted retry summary by ZIP ranges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python open_evidence_runner/extract_remote_targeted_retry_summary.py \
            --repository siner9586/ai_research \
            --artifact-id 8621073379 \
            --year 2025 \
            --output summary-2025-targeted
      - name: Upload compact targeted retry audit
        uses: actions/upload-artifact@v4
        with:
          name: crossref-2025-targeted-retry-summary-only
          path: summary-2025-targeted/
          retention-days: 30
          compression-level: 9
          if-no-files-found: error
