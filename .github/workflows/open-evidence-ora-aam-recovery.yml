name: open-evidence-ora-aam-recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Recover ORA CC BY accepted manuscript
        run: python open_evidence_runner/recover_ora_aam.py
      - name: Upload verified accepted manuscript and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ora-principles-trust-ai-aam
          path: ora-aam/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
