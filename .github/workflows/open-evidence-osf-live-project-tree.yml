name: open-evidence-osf-live-project-tree

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-tree:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node_id: [fusx4, b7we5, 6rjuz]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSF file-audit runtime
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Recursively audit the lawful public live project and all components
        run: >-
          python open_evidence_runner/audit_osf_live_project_tree.py
          --node-id "${{ matrix.node_id }}"
          --output "osf-live-tree-${{ matrix.node_id }}"
      - name: Validate tree and file audit package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('osf-live-tree-${{ matrix.node_id }}')
          report=json.loads((root/'osf_live_project_tree_audit.json').read_text())
          assert report['root_node_id']=='${{ matrix.node_id }}'
          assert report['completed'] is True
          assert report['node_count'] >= 1
          assert isinstance(report['downloaded'], list)
          assert report['files_selected_and_downloaded']==len(report['downloaded'])
          assert report['participant_level_verified'] is False
          assert report['trial_level_verified'] is False
          PY
      - name: Upload live-project tree, public files and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osf-live-project-tree-${{ matrix.node_id }}
          path: osf-live-tree-${{ matrix.node_id }}/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
