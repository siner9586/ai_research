name: open-evidence-fulltext-core-2
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - run: python open_evidence_runner/fulltext_core_batch_2.py --output fulltext-core-2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-evidence-fulltext-core-2
          path: fulltext-core-2/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
